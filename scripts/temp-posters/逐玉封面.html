<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>逐玉 MBTI 人物群像</title>
  <style>
    :root {
      --ink: #2f2430;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #1a1a1a;
      font-family: 'Noto Serif SC', 'Songti SC', 'STSong', serif;
      color: var(--ink);
    }

    .poster-container {
      width: 540px;
      aspect-ratio: 9 / 16;
      position: relative;
      overflow: hidden;
      background: #000;
    }

    .collage {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 0;
    }

    .still-card {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .still-card img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: center;
      filter: saturate(0.88) contrast(1.02) brightness(0.96);
    }

    .label {
      position: absolute;
      left: 10px;
      right: 10px;
      bottom: 14px;
      z-index: 5;
      padding: 12px 4px 10px;
      border-radius: 12px;
      background: linear-gradient(180deg, rgba(58, 36, 40, 0.35), rgba(36, 20, 23, 0.70));
      border: 1px solid rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);

      color: rgba(255, 248, 242, 0.98);
      text-align: center;
      pointer-events: none;
    }

    .label .cn {
      font-size: 20px;
      letter-spacing: 2px;
      font-weight: 700;
      display: block;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
    }

    .label .mbti {
      display: block;
      margin-top: 6px;
      font-size: 13px;
      letter-spacing: 2.5px;
      color: #f2e1cc;
      font-family: sans-serif;
      font-weight: bold;
      text-transform: uppercase;
      opacity: 0.95;
    }

    .grain {
      position: absolute;
      inset: 0;
      opacity: 0.12;
      background-image:
        linear-gradient(rgba(0, 0, 0, 0.2) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 0, 0, 0.2) 1px, transparent 1px);
      background-size: 4px 4px;
      mix-blend-mode: multiply;
      z-index: 10;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="poster-container">
    <div class="grain"></div>

    <div class="collage">
      <div class="still-card">
        <img src="/Users/russell/Documents/coding_save/indie-project/mbti-operation-space/images/逐玉剧照/樊长玉.jpg" alt="樊长玉" style="object-position: 40.7% 50.6%">
        <div class="label">
          <span class="cn">樊长玉</span>
          <span class="mbti">ESFP</span>
        </div>
      </div>
      <div class="still-card">
        <img src="/Users/russell/Documents/coding_save/indie-project/mbti-operation-space/images/逐玉剧照/谢征.jpg" alt="谢征" style="object-position: 52.0% 32.1%">
        <div class="label">
          <span class="cn">谢征</span>
          <span class="mbti">INTJ</span>
        </div>
      </div>
      <div class="still-card">
        <img src="/Users/russell/Documents/coding_save/indie-project/mbti-operation-space/images/逐玉剧照/随元青.jpg" alt="随元青" style="object-position: 42.6% 30.8%">
        <div class="label">
          <span class="cn">随元青</span>
          <span class="mbti">ESTP</span>
        </div>
      </div>
      <div class="still-card">
        <img src="/Users/russell/Documents/coding_save/indie-project/mbti-operation-space/images/逐玉剧照/齐旻.jpg" alt="齐旻" style="object-position: 72.3% 35.3%">
        <div class="label">
          <span class="cn">齐旻</span>
          <span class="mbti">INFJ</span>
        </div>
      </div>
      <div class="still-card">
        <img src="/Users/russell/Documents/coding_save/indie-project/mbti-operation-space/images/逐玉剧照/俞浅浅.jpg" alt="俞浅浅" style="object-position: 57.7% 43.6%">
        <div class="label">
          <span class="cn">俞浅浅</span>
          <span class="mbti">ENTP</span>
        </div>
      </div>
      <div class="still-card">
        <img src="/Users/russell/Documents/coding_save/indie-project/mbti-operation-space/images/逐玉剧照/李怀安.jpg" alt="李怀安" style="object-position: 49.7% 34.2%">
        <div class="label">
          <span class="cn">李怀安</span>
          <span class="mbti">ISFJ</span>
        </div>
      </div>
      <div class="still-card">
        <img src="/Users/russell/Documents/coding_save/indie-project/mbti-operation-space/images/逐玉剧照/宋砚.jpg" alt="宋砚" style="object-position: 35.9% 45.8%">
        <div class="label">
          <span class="cn">宋砚</span>
          <span class="mbti">ISFJ</span>
        </div>
      </div>
      <div class="still-card">
        <img src="/Users/russell/Documents/coding_save/indie-project/mbti-operation-space/images/逐玉剧照/魏严.jpg" alt="魏严" style="object-position: 46.8% 48.1%">
        <div class="label">
          <span class="cn">魏严</span>
          <span class="mbti">ENTJ</span>
        </div>
      </div>
      <div class="still-card">
        <img src="/Users/russell/Documents/coding_save/indie-project/mbti-operation-space/images/逐玉剧照/赵大娘.jpg" alt="赵大娘" style="object-position: 39.9% 30.3%">
        <div class="label">
          <span class="cn">赵大娘</span>
          <span class="mbti">ESFJ</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
